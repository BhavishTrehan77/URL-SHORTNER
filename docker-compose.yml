services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: url-shortner-app
    ports:
      - "3000:3000"
    env_file:
      - .env
    depends_on:
      - redis
     
  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
  mongo:
    image: mongo:8
    container_name: mongo
    ports:
      - "27017:27017"
    
